<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toggle Switch</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; background: #fafafa; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; }

    .toggle-container { display: flex; align-items: center; gap: 16px; }

    .toggle-label { font-size: 15px; color: #333; }

    .toggle-switch {
      width: 56px;
      height: 32px;
      background: rgb(238, 238, 238);
      border-radius: 48px;
      position: relative;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .toggle-switch.active { background: rgb(255, 97, 26); }

    .toggle-ball {
      position: absolute;
      width: 26px;
      height: 26px;
      background: white;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .toggle-switch.active .toggle-ball { left: 27px; }
  </style>
</head>
<body>
  <div class="toggle-container">
    <span class="toggle-label">Express Delivery</span>
    <div class="toggle-switch" id="toggle1" role="switch" aria-checked="false" tabindex="0">
      <div class="toggle-ball"></div>
    </div>
  </div>

  <script>
    const toggle = document.getElementById('toggle1');

    toggle.addEventListener('click', () => {
      toggle.classList.toggle('active');
      toggle.setAttribute('aria-checked', toggle.classList.contains('active'));
    });

    toggle.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggle.classList.toggle('active');
        toggle.setAttribute('aria-checked', toggle.classList.contains('active'));
      }
    });
  </script>
</body>
</html>
