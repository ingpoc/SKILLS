<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip Card</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; background: #fafafa; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; }

    .flip-card-container { perspective: 1000px; width: 100%; max-width: 320px; height: 240px; }

    .flip-card {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .flip-card.flipped { transform: rotateY(180deg); }

    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    .flip-card-front { background: white; }

    .flip-card-back {
      background: rgb(238, 238, 238);
      transform: rotateY(180deg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .flip-header { padding: 20px; }

    .flip-title { font-size: 18px; font-weight: 500; color: #333; margin-bottom: 4px; }
    .flip-subtitle { font-size: 13px; color: #999; }

    .flip-body { padding: 0 20px 20px; }

    .flip-stat {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    .flip-stat-label { font-size: 14px; color: #666; }
    .flip-stat-value { font-size: 14px; font-weight: 500; color: #333; }

    .flip-hint {
      text-align: center;
      font-size: 12px;
      color: #999;
      padding: 16px;
      background: rgb(238, 238, 238);
    }

    .flip-back-title { font-size: 16px; font-weight: 500; color: #333; margin-bottom: 16px; }

    .flip-spec { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
    .flip-spec-dot { width: 8px; height: 8px; border-radius: 50%; background: rgb(255, 97, 26); }
    .flip-spec-text { font-size: 14px; color: #555; }
  </style>
</head>
<body>
  <div class="flip-card-container">
    <div class="flip-card" id="flipCard1" tabindex="0" role="button" aria-label="Flip card to see specifications">
      <div class="flip-card-front">
        <div class="flip-header">
          <div class="flip-title">Braun Speaker</div>
          <div class="flip-subtitle">Audio Equipment</div>
        </div>
        <div class="flip-body">
          <div class="flip-stat">
            <span class="flip-stat-label">Power</span>
            <span class="flip-stat-value">60W</span>
          </div>
          <div class="flip-stat">
            <span class="flip-stat-label">Frequency</span>
            <span class="flip-stat-value">50Hz - 20kHz</span>
          </div>
          <div class="flip-stat">
            <span class="flip-stat-label">Weight</span>
            <span class="flip-stat-value">2.4 kg</span>
          </div>
        </div>
        <div class="flip-hint">Click to see specs</div>
      </div>
      <div class="flip-card-back">
        <div class="flip-back-title">Specifications</div>
        <div class="flip-spec">
          <div class="flip-spec-dot"></div>
          <span class="flip-spec-text">Bluetooth 5.0 connectivity</span>
        </div>
        <div class="flip-spec">
          <div class="flip-spec-dot"></div>
          <span class="flip-spec-text">12 hour battery life</span>
        </div>
        <div class="flip-spec">
          <div class="flip-spec-dot"></div>
          <span class="flip-spec-text">USB-C fast charging</span>
        </div>
        <div class="flip-spec">
          <div class="flip-spec-dot"></div>
          <span class="flip-spec-text">360° immersive sound</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const flipCard = document.getElementById('flipCard1');

    flipCard.addEventListener('click', () => flipCard.classList.toggle('flipped'));
    flipCard.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        flipCard.classList.toggle('flipped');
      }
    });
  </script>
</body>
</html>
