<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Box</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; background: #fafafa; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; }

    .select-box {
      display: inline-flex;
      align-items: center;
      background: rgb(238, 238, 238);
      border-radius: 48px;
      padding: 4px;
    }

    .select-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .select-btn:hover { background: rgba(255, 97, 26, 0.1); }
    .select-btn:active { transform: scale(0.95); }

    .select-btn svg { width: 16px; height: 16px; fill: #333; transition: fill 0.2s ease; }
    .select-btn:hover svg { fill: rgb(255, 97, 26); }

    .select-value {
      width: 60px;
      text-align: center;
      font-size: 16px;
      font-weight: 500;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="select-box" id="quantitySelect" role="spinbutton" aria-valuenow="1" aria-valuemin="1" aria-valuemax="99">
    <button class="select-btn minus-btn" aria-label="Decrease quantity">
      <svg viewBox="0 0 256 256"><path d="M216,128a8,8,0,0,1-8,8H48a8,8,0,0,1,0-16H208A8,8,0,0,1,216,128Z"/></svg>
    </button>
    <span class="select-value">1</span>
    <button class="select-btn plus-btn" aria-label="Increase quantity">
      <svg viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/></svg>
    </button>
  </div>

  <script>
    const quantitySelect = document.getElementById('quantitySelect');
    const quantityValue = quantitySelect.querySelector('.select-value');
    let quantity = 1;

    quantitySelect.querySelector('.plus-btn').addEventListener('click', () => {
      if (quantity < 99) {
        quantity++;
        quantityValue.textContent = quantity;
        quantitySelect.setAttribute('aria-valuenow', quantity);
      }
    });

    quantitySelect.querySelector('.minus-btn').addEventListener('click', () => {
      if (quantity > 1) {
        quantity--;
        quantityValue.textContent = quantity;
        quantitySelect.setAttribute('aria-valuenow', quantity);
      }
    });
  </script>
</body>
</html>
