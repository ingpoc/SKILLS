<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Group</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; background: #fafafa; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; }

    .radio-group { display: flex; flex-wrap: wrap; gap: 12px; }

    .radio-option { position: relative; }

    .radio-option input { position: absolute; opacity: 0; pointer-events: none; }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      background: rgb(238, 238, 238);
      border-radius: 48px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .radio-label:hover { background: rgb(232, 232, 232); }

    .radio-option input:checked + .radio-label {
      background: rgb(255, 97, 26);
      color: white;
    }

    .radio-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #999;
      transition: all 0.3s ease;
    }

    .radio-option input:checked + .radio-label .radio-dot {
      border-color: white;
      background: white;
    }

    .radio-text { font-size: 14px; }
  </style>
</head>
<body>
  <div class="radio-group" role="radiogroup" aria-label="Color options">
    <div class="radio-option">
      <input type="radio" name="color" id="color1" checked>
      <label class="radio-label" for="color1">
        <div class="radio-dot"></div>
        <span class="radio-text">White</span>
      </label>
    </div>
    <div class="radio-option">
      <input type="radio" name="color" id="color2">
      <label class="radio-label" for="color2">
        <div class="radio-dot"></div>
        <span class="radio-text">Black</span>
      </label>
    </div>
    <div class="radio-option">
      <input type="radio" name="color" id="color3">
      <label class="radio-label" for="color3">
        <div class="radio-dot"></div>
        <span class="radio-text">Orange</span>
      </label>
    </div>
  </div>
</body>
</html>
