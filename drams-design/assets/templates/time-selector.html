<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Selector</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; background: #fafafa; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; }

    .time-selector { display: flex; align-items: center; gap: 12px; }

    .time-unit { display: flex; flex-direction: column; align-items: center; }

    .time-label {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .time-display {
      width: 80px;
      height: 80px;
      background: rgb(238, 238, 238);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 300;
      color: #333;
      position: relative;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.8), 0 2px 8px rgba(0,0,0,0.08);
    }

    .time-display::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid transparent;
      transition: border-color 0.3s ease;
    }

    .time-unit.active .time-display::before { border-color: rgb(255, 97, 26); }

    .time-controls { display: flex; gap: 8px; margin-top: 12px; }

    .time-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: rgb(255, 97, 26);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 2px 8px rgba(255, 97, 26, 0.3);
    }

    .time-btn:hover { transform: scale(1.05); }
    .time-btn:active { transform: scale(0.95); }

    .time-separator { font-size: 24px; color: #999; font-weight: 300; }
  </style>
</head>
<body>
  <div class="time-selector">
    <div class="time-unit active" id="hoursUnit">
      <span class="time-label">Hours</span>
      <div class="time-display">
        <span class="time-value hours">02</span>
      </div>
      <div class="time-controls">
        <button class="time-btn time-up" data-unit="hours" aria-label="Increase hours">+</button>
        <button class="time-btn time-down" data-unit="hours" aria-label="Decrease hours">−</button>
      </div>
    </div>
    <span class="time-separator">:</span>
    <div class="time-unit active" id="minutesUnit">
      <span class="time-label">Minutes</span>
      <div class="time-display">
        <span class="time-value minutes">30</span>
      </div>
      <div class="time-controls">
        <button class="time-btn time-up" data-unit="minutes" aria-label="Increase minutes">+</button>
        <button class="time-btn time-down" data-unit="minutes" aria-label="Decrease minutes">−</button>
      </div>
    </div>
  </div>

  <script>
    const timeValues = { hours: 2, minutes: 30 };

    document.querySelectorAll('.time-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const unit = btn.dataset.unit;
        const isUp = btn.classList.contains('time-up');
        const display = document.getElementById(unit + 'Unit').querySelector('.time-value');

        if (isUp) {
          if (unit === 'hours' && timeValues[unit] < 12) timeValues[unit]++;
          if (unit === 'minutes' && timeValues[unit] < 59) timeValues[unit] = Math.min(59, timeValues[unit] + 15);
        } else {
          if (unit === 'hours' && timeValues[unit] > 0) timeValues[unit]--;
          if (unit === 'minutes' && timeValues[unit] > 0) timeValues[unit] = Math.max(0, timeValues[unit] - 15);
        }

        display.textContent = String(timeValues[unit]).padStart(2, '0');
      });
    });
  </script>
</body>
</html>
