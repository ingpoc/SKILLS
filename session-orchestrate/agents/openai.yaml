interface:
  display_name: "Session Orchestrate"
  short_description: "Chain bounded Codex tasks with exact checkpoint handoffs"
  default_prompt: "Use $session-orchestrate to ensure the repo-local .session workspace, inspect current product-plan owners and implementation evidence through the cheap deterministic entry path, and refresh source-fingerprinted tracking when stale. Follow exploration.action and use the configured read-only explorer role only when first migration, broad stale reconstruction, or conflicting evidence makes delegation net-positive; keep goal selection and accepted evidence on the main thread. Resume an exact checkpoint only when $resume-session, the current plan, and .session/TRACKING.json all permit it; otherwise rebuild the ordered goals and execute one session-sized goal. Record completion evidence, preserve all authority gates, and create no more than one successor."

policy:
  allow_implicit_invocation: false
